name: app-search

services:
  searxng:
    container_name: app-searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    volumes:
      - ./config:/etc/searxng
      - searxng-cache:/var/cache/searxng

volumes:
  searxng-cache:
